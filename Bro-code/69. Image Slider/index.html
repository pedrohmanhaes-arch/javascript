<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Slider</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="slider">
        <div class="slides">
            <img class="slide" src="Image1.png" width="400px" alt="Img #1">

            <img class="slide" src="Image2.png" width="400px" alt="Img #2">

            <img class="slide" src="image3.png" width="400px" alt="Img #3">
        </div>

        <button class="prev" onclick="prevSlide()">&#10094</button>
        <button class="next" onclick="nextSlide()">&#10095</button>

    </div>
    <script src="index.js"></script>
</body>
</html>
